[package]
name = "golish-pty"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "PTY and terminal management for Golish"

[dependencies]
# Foundation crates
golish-core = { workspace = true }
golish-platform = { workspace = true }
golish-settings = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# PTY support
portable-pty = { workspace = true }
vte = { version = "0.13" }

# Virtual terminal grid (Phase B · GridTerminal) — drives alt-screen
# rendering through `alacritty_terminal`, which is the same vt parser /
# screen-state machine that powers Alacritty, Wezterm, and Warp. We use
# it to maintain a full grid (cells + cursor + scrollback) for any
# session that enters alt-screen, then ship per-frame diffs to the
# frontend so vim / htop / less can render without xterm.js.
alacritty_terminal = "0.26"
unicode-width = "0.2"
bitflags = "2"

# Concurrency
parking_lot = { version = "0.12" }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
tracing = { version = "0.1" }
dirs = { workspace = true }
itoa = { version = "1.0" }

# Error handling
thiserror = { version = "2.0" }

[dev-dependencies]
proptest = { workspace = true }

[features]
default = []
