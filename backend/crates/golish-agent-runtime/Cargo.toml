[package]
name = "golish-agent-runtime"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "High-level agent runtime (renamed from golish-agent-runtime in A2): streaming tool-call loop, sub-agent dispatch, compaction, eval harness, mock test_utils."

[dependencies]
# Sibling Layer-4 crate that provides the lower-level building blocks
# (tool_executors / tool_definitions / system_hooks / tool_policy / hitl /
#  loop_detection / sidecar_trait / planner / db_* / memory_*).
golish-agent-kit = { workspace = true }

# Foundation crates (kept as direct deps because the loop body itself
# touches their public types in numerous places).
golish-core = { workspace = true }
golish-context = { workspace = true }
golish-events = { path = "../golish-events" }
golish-llm-providers = { workspace = true }
golish-settings = { workspace = true }
golish-tools = { workspace = true }
golish-sub-agents = { workspace = true }
golish-prompts = { workspace = true }
golish-indexer = { workspace = true }

# JSON repair for malformed LLM output
golish-json-repair = { path = "../golish-json-repair" }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }
parking_lot = { workspace = true }
regex = { workspace = true }
tokenx-rs = { workspace = true }

# LLM integration via rig
rig-core = { workspace = true }
rig-anthropic-vertex = { path = "../rig-anthropic-vertex" }
rig-openai-responses = { path = "../rig-openai-responses" }

# HTTP client (used by retry helpers / eval_support)
reqwest = { workspace = true }

# tempfile is required when the `test-utils` feature is enabled (it
# powers the `TestContextBuilder` helpers). Marked `optional` so a normal
# release build of downstream crates does not pay for it.
tempfile = { workspace = true, optional = true }

[features]
default = []
# Expose `test_utils` for downstream crates' test/dev builds.
test-utils = ["golish-agent-kit/test-utils", "dep:tempfile"]

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
