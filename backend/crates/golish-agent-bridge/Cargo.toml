[package]
name = "golish-agent-bridge"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Bridge layer between the Tauri app and the agent runtime (A1-3): AgentBridge struct, bridge_* helpers, and task_orchestrator::bridge_executor."

[dependencies]
# Foundation crates
golish-core = { workspace = true }
golish-settings = { workspace = true }
golish-tools = { workspace = true }

# AI subsystem
golish-prompts = { workspace = true }
golish-agent-kit = { workspace = true }
golish-app-core = { workspace = true }
golish-agent-runtime = { workspace = true }
golish-events = { path = "../golish-events" }
golish-context = { workspace = true }
golish-indexer = { workspace = true }
golish-llm-providers = { workspace = true }
golish-memory-app = { workspace = true }
golish-sub-agents = { workspace = true }
golish-session = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }
parking_lot = { workspace = true }
regex = { workspace = true }
tokenx-rs = { workspace = true }

# LLM via rig
rig-core = { workspace = true }
rig-anthropic-vertex = { path = "../rig-anthropic-vertex" }
rig-openai-responses = { path = "../rig-openai-responses" }

# HTTP client
reqwest = { workspace = true }

[features]
default = []

[dev-dependencies]
tempfile = { workspace = true }
