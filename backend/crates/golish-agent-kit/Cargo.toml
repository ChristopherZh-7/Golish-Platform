[package]
name = "golish-agent-loop"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Agentic loop runtime extracted from golish-ai (A1-2): tool execution, loop detection, task orchestration, HITL approval, tool policy, planner, in-memory db tracking, llm-client wiring."

[dependencies]
# Foundation crates
golish-core = { workspace = true }
golish-settings = { workspace = true }
golish-tools = { workspace = true }

# Extracted AI subsystem dependencies
golish-events = { path = "../golish-events" }
golish-context = { workspace = true }
golish-indexer = { workspace = true }
golish-llm-providers = { workspace = true }
golish-sub-agents = { workspace = true }
golish-prompts = { workspace = true }

# JSON repair for malformed LLM output
golish-json-repair = { path = "../golish-json-repair" }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Async runtime
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }
parking_lot = { workspace = true }
regex = { workspace = true }
tokenx-rs = { workspace = true }

# LLM integration via rig
rig-core = { workspace = true }
rig-anthropic-vertex = { path = "../rig-anthropic-vertex" }
rig-openai-responses = { path = "../rig-openai-responses" }

# HTTP client (needed for llm_client.rs)
reqwest = { workspace = true }

[features]
default = []
# Expose `test_utils` for downstream crates' test/dev builds.
test-utils = []

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
