[package]
name = "golish-graphiti"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "PostgreSQL-backed graph knowledge base for security entity/relation reasoning"

[dependencies]
# Persistence layer that owns the embedded PG instance and the
# `graph_knowledge_base` migration this crate's tables live in. Depending on it
# turns the previously-implicit "shares golish-db's PG" coupling into a
# compiler-visible edge and lets us consume its canonical `PgPool` type.
golish-db = { workspace = true }

# Async SQL toolkit. Kept workspace-aligned with golish-db so the two crates
# never drift onto divergent sqlx feature sets while sharing one pool.
sqlx = { workspace = true }

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling
thiserror.workspace = true

# Tracing
tracing.workspace = true

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
