[workspace.package]
version = "0.2.43"
edition = "2021"
authors = ["you"]
license = "MIT"
repository = "https://github.com/ChristopherZh-7/golish-platform"

[workspace.dependencies]
# Internal crates
golish-cli-output = { path = "crates/golish-cli-output" }
golish-core = { path = "crates/golish-core" }
golish-app-core = { path = "crates/golish-app-core" }
golish-vuln-app = { path = "crates/golish-vuln-app" }
golish-recon-app = { path = "crates/golish-recon-app" }
golish-pentest-app = { path = "crates/golish-pentest-app" }
golish-agent-app = { path = "crates/golish-agent-app" }
golish-platform-app = { path = "crates/golish-platform-app" }
golish-models = { path = "crates/golish-models" }
golish-settings = { path = "crates/golish-settings" }
golish-tools = { path = "crates/golish-tools" }
golish-udiff = { path = "crates/golish-udiff" }
golish-pty = { path = "crates/golish-pty" }
golish-sidecar = { path = "crates/golish-sidecar" }
golish-artifacts = { path = "crates/golish-artifacts" }
golish-session = { path = "crates/golish-session" }
golish-context = { path = "crates/golish-context" }
golish-agent-kit = { path = "crates/golish-agent-kit" }
golish-agent-runtime = { path = "crates/golish-agent-runtime" }
golish-agent-bridge = { path = "crates/golish-agent-bridge" }
golish-events = { path = "crates/golish-events" }
golish-sub-agents = { path = "crates/golish-sub-agents" }
golish-llm-providers = { path = "crates/golish-llm-providers" }
golish-web = { path = "crates/golish-web" }
golish-shell-exec = { path = "crates/golish-shell-exec" }
golish-synthesis = { path = "crates/golish-synthesis" }
golish-skills = { path = "crates/golish-skills" }
rig-zai-sdk = { path = "crates/rig-zai-sdk" }
rig-gemini-vertex = { path = "crates/rig-gemini-vertex" }
golish-pentest = { path = "crates/golish-pentest" }
golish-pentest-domain = { path = "crates/golish-pentest-domain" }
golish-pentest-mcp = { path = "crates/golish-pentest-mcp" }
golish-pipeline = { path = "crates/golish-pipeline" }
golish-vuln-intel = { path = "crates/golish-vuln-intel" }
golish-vuln-intel-domain = { path = "crates/golish-vuln-intel-domain" }
golish-scan-runner = { path = "crates/golish-scan-runner" }
golish-projects = { path = "crates/golish-projects" }
golish-indexer = { path = "crates/golish-indexer" }
golish-db = { path = "crates/golish-db" }
golish-graphiti = { path = "crates/golish-graphiti" }
golish-prompts = { path = "crates/golish-prompts" }
golish-js-analyzer = { path = "crates/golish-js-analyzer" }
golish-auth-probe = { path = "crates/golish-auth-probe" }
golish-platform = { path = "crates/golish-platform" }
golish-intel-providers = { path = "crates/golish-intel-providers" }
golish-integrations = { path = "crates/golish-integrations" }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
pg-embed = { version = "1", features = ["rt_tokio"] }

# Tauri (optional - only for GUI app)
tauri = { version = "2", features = ["unstable"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = { version = "2" }
tauri-plugin-shell = { version = "2" }
tauri-plugin-notification = { version = "2" }

# CLI dependencies (optional - only for CLI binary)
clap = { version = "4", features = ["derive", "env"] }
atty = { version = "0.2" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"

# Cross-IPC type generation (Rust -> TS). See docs/design/2026-05-29-architecture-optimization.md §4.2 / AGENTS.md I5
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "chrono-impl"] }

# File watching
notify = "8"
notify-debouncer-mini = "0.7"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Terminal
portable-pty = "0.9"
vte = "0.15"

# Utilities
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
parking_lot = "0.12"
base64 = "0.22"
sha2 = "0.11"
zip = { version = "8", default-features = false, features = ["deflate"] }
walkdir = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
nix = "0.31"
libc = "0.2"

# OpenTelemetry for Langfuse tracing (0.31 to match opentelemetry-langfuse)
opentelemetry = { version = "0.31", features = ["trace"] }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio", "experimental_trace_batch_span_processor_with_async_runtime"] }
opentelemetry-otlp = { version = "0.31", features = ["http-proto", "trace", "reqwest-client"] }
opentelemetry-semantic-conventions = "0.31"
tracing-opentelemetry = "0.32"
opentelemetry-langfuse = "0.6"
similar = "3"

# Template engine for prompt templates
tera = "1"

# File indexing
vtcode-indexer = "0.105"
futures = "0.3"
async-stream = "0.3"
dotenvy = "0.15"

# Web search
tavily = "0.2"

# Web fetching and content extraction
reqwest = { version = "0.13", features = ["json", "socks"] }
readability = { version = "0.3", default-features = false }
url = "2.5"

# Token estimation
tokenx-rs = "0.1"

# Rig core for LLM orchestration
rig-core = { version = "^0.36.0", features = [] }
# Rig companion crate for Google Vertex AI (Gemini)
rig-vertexai = { version = "0.2.4" }

# HTTP utilities (for custom HTTP clients)
http = "1.2"

tempfile = { version = "3" }

# Google Cloud authentication (for sidecar Vertex AI synthesis)
gcp_auth = "0.12"

# Graph-based workflow execution for multi-agent systems
graph-flow = "0.5"
async-trait = "0.1"
# File walking with gitignore support
ignore = "0.4"

# Pattern matching and regex
glob = "0.3"
regex = "1"

# XML parsing (for RSS feeds)
quick-xml = "0.39"

# TOML settings file support
toml = "0.8"


# TLS crypto provider (required for rustls 0.23+)
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# Bytes utilities
bytes = "1"

# Dev dependencies
proptest = "1.4"
tower = { version = "0.5", features = ["util"] }
serial_test = "3"

# Dev profile: optimize for fast incremental builds
[profile.dev]
# Faster linking on macOS
split-debuginfo = "unpacked"
# More parallelism during codegen
codegen-units = 256

# Optimize dependencies in dev mode (they don't change often)
# This significantly speeds up runtime without hurting compile times
[profile.dev.package."*"]
opt-level = 2

# Release profile: optimize for runtime performance
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
