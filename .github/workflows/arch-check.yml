name: Architecture

# Guards the layered DAG and per-file size budgets described in
# docs/architecture.md. Lightweight; runs on every PR and on push to main.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

jobs:
  dag:
    name: DAG (no back-edges, no cycles)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run DAG check
        run: python3 scripts/check_dag.py

  repo-ownership:
    name: Repo data-ownership boundary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run repo-ownership guard
        run: python3 scripts/check_repo_ownership.py

  file-sizes:
    name: File size budgets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run file-size guard
        run: bash scripts/check_file_sizes.sh

  store-slices:
    name: Frontend store slice budget
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run store-slice guard
        run: bash scripts/check_store_slices.sh
